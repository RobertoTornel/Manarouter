[package]
name = "mr-core"
description = "Shared types, routing snapshot format, config and storage for Manarouter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }
smallvec = { workspace = true }
arc-swap = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
aes-gcm = { workspace = true }
# Only `oauth/reference.rs` uses this (entered through `oauth/migrate.rs`): the reference OmniRoute
# database derives its field-encryption key with scrypt, so reading those tokens requires it. The
# runtime never calls into that module.
scrypt = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
tracing = { workspace = true }
memchr = { workspace = true }
http = { workspace = true }
socket2 = { workspace = true }
httpdate = { workspace = true }
# OAuth (crates/mr-core/src/oauth) and quota probing (crates/mr-core/src/quota/http.rs) are the
# only parts of this crate that reach the network: the authorization-code exchange, refresh,
# device-code polls and quota reads all speak HTTPS. These are workspace dependencies, so nothing
# new enters the tree — the relay already builds on the HTTP/TLS ones.
async-trait = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
http-body-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
