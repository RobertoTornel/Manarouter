<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Manarouter — panel</title>
<!-- Install-local SVG favicon: no CDN, and no request that can leave the loopback interface.
     A browser that cannot render an SVG icon shows no icon, which is what the old `data:,`
     stub did as well. -->
<link rel="icon" type="image/svg+xml" href="./logo.svg">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<!-- The router (app.js) reads every fragment as a route and falls back to Overview, so following
     the skip link would replace the current view instead of moving the reader into <main>. Focus
     it in place and leave the hash — and the current view — alone. -->
<script>
  document.addEventListener('click', (e) => {
    const link = e.target instanceof Element ? e.target.closest('a.skip-link') : null;
    if (!link) return;
    e.preventDefault();
    const main = document.getElementById('main');
    if (main) { main.focus(); main.scrollIntoView({ block: 'start' }); }
  });
</script>

<div id="app-root">
  <div id="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="./logo.svg" alt="" width="22" height="22">
        <span class="brand-name">Manarouter</span>
      </div>
      <nav aria-label="Primary">
        <ul id="nav-list">
          <li><a href="#/overview"  data-route="overview">Overview</a></li>
          <li><a href="#/providers" data-route="providers">Providers</a></li>
          <li><a href="#/combos"    data-route="combos">Combos</a></li>
          <li><a href="#/keys"      data-route="keys">Keys</a></li>
          <li><a href="#/aliases"   data-route="aliases">Aliases</a></li>
          <li><a href="#/models"    data-route="models">Models</a></li>
          <li><a href="#/quota"     data-route="quota">Quota</a></li>
          <li><a href="#/settings"  data-route="settings">Settings</a></li>
          <li><a href="#/docs"      data-route="docs">Documentation</a></li>
        </ul>
      </nav>
      <!-- No log-out button by design: the panel is a local, single-operator console, and a
           log-out control invited the idea that closing the tab or signing out locked it. The
           session still expires server-side and the 401 handler still returns to the sign-in
           screen; see panel/README.md. -->
      <div class="sidebar-foot">
        <div id="sidebar-meta" class="sidebar-meta"></div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <h1 id="topbar-title" class="topbar-title">Overview</h1>
        <!-- button, not span: it navigates to the overview, so it must be keyboard reachable -->
        <button id="topbar-health" class="health-pill" type="button" aria-label="Control plane status">
          <span class="dot dot-idle" aria-hidden="true"></span>
          <span class="health-text">checking…</span>
        </button>
      </header>

      <!-- Restart-pending banner lives here, above <main>, so it persists across every view -->
      <div id="banner-slot"></div>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="login-root" hidden></div>
</div>

<div id="drawer-root"></div>
<div id="dialog-root"></div>
<div id="toasts" class="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>

<noscript><p class="noscript">This panel requires JavaScript.</p></noscript>

<script type="module" src="./app.js"></script>
</body>
</html>
