<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Manarouter">
  <title>Manarouter</title>
  <!-- The mark in one sentence: one request in on the left, one chosen route out on the right,
       with the two routes not taken drawn dimmer. Pink is the panel's single accent, so the
       chosen route is the only saturated stroke in the icon. -->
  <rect width="32" height="32" rx="7" fill="#16191b"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#2b3134"/>
  <!-- Inbound request -->
  <path d="M5 16h7.4" stroke="#cf4f85" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Routes not taken -->
  <path d="M16 16c4.6 0 5.6-8.4 9.2-8.4" stroke="#5a3a47" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M16 16c4.6 0 5.6 8.4 9.2 8.4" stroke="#5a3a47" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- The route that won -->
  <path d="M16 16h9.2" stroke="#e7729f" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- The routing decision -->
  <circle cx="16" cy="16" r="3.4" fill="#e7729f"/>
  <circle cx="16" cy="16" r="1.2" fill="#180a11"/>
  <!-- Exit points -->
  <circle cx="26.6" cy="7.6" r="1.7" fill="#7a4657"/>
  <circle cx="26.6" cy="16" r="2" fill="#e7729f"/>
  <circle cx="26.6" cy="24.4" r="1.7" fill="#7a4657"/>
</svg>
