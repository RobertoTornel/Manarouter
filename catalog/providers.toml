# ---------------------------------------------------------------------------------------------
# Not shipped, deliberately
# ---------------------------------------------------------------------------------------------
# kiro               — AWS CodeWhisperer event-stream protocol; no Dialect can express it.
# fishaudio          — bespoke TTS surface; the research records no HTTP chat base.
# auggie, zcode      — non-HTTP (CLI/stdio) transports.
# cloudflare-playground — cf_agent RPC over WebSocket, no key.
# codex-app-server, devin-cli-agentic — local app servers, not upstream providers.
# aihorde, pollinations — excluded by the project's no-web-session decision.
# claude-web, deepseek-web, gemini-web, zai-web, duckduckgo-web, lmarena, veoaifree-web — cookie /
#                        browser-session auth, excluded by the same decision.
